server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS embedded — resolve upstream saat REQUEST (lazy), bukan saat boot,
    # supaya nginx tak crash "host not found" kalau engine/backend telat siap.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # SPA fallback — semua rute diarahkan ke index.html. index.html JANGAN di-cache
    # browser/HP, supaya selalu ambil bundle JS terbaru (hash baru) setelah rebuild.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Aset ber-hash (nama berubah tiap build) -> aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Reverse proxy: 1 URL publik untuk seluruh sistem (online via tunnel) ---
    # REST API backend (mount di /api). $uri (/api/...) diteruskan apa adanya.
    location /api/ {
        set $backend_up backend;
        proxy_pass http://$backend_up:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket realtime (alert/event). Butuh upgrade header.
    location /ws {
        set $backend_ws backend;
        proxy_pass http://$backend_ws:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Engine MJPEG + snapshot + ROI. Hapus prefix /engine lalu proxy ke engine:8090.
    # proxy_buffering off WAJIB agar MJPEG (multipart) mengalir realtime.

    # MULTIPROCESS: pipeline pedestrian jalan di container TERPISAH `engine-ped`.
    # Rute stream kamera pedestrian (CAM-05/06/07) + galeri/enroll/trajektori ke sana.
    # regex location diutamakan atas prefix /engine/ -> endpoint lain ke engine utama.
    location ~ ^/engine/stream/CAM-0[567](/|$) {
        set $engped engine-ped;
        rewrite ^/engine/(.*)$ /$1 break;
        proxy_pass http://$engped:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
    location ~ ^/engine/(snapshots|trajectory|enroll-from-snapshot|snapshot-delete) {
        set $engped2 engine-ped;
        rewrite ^/engine/(.*)$ /$1 break;
        proxy_pass http://$engped2:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Sisanya (parkir, sampah, /snap-img dari volume bersama, /roi, /park-*, /waste-*) -> engine UTAMA.
    location /engine/ {
        set $engine_up engine;
        rewrite ^/engine/(.*)$ /$1 break;
        proxy_pass http://$engine_up:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
