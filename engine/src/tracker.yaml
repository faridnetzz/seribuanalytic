# Tracker BoT-SORT — disetel untuk PERSISTENSI ID (kurangi ID switch/snapshot dobel).
# track_buffer besar = pertahankan track yang sempat hilang lebih lama -> ID sama
# saat orang muncul lagi (mengatasi tracking lepas di fps rendah multi-kamera).
tracker_type: botsort
track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 150            # default 30 -> 150 (jauh lebih sabar mempertahankan ID)
match_thresh: 0.85
fuse_score: True
gmc_method: None            # kamera CCTV FIXED -> kompensasi gerak kamera tak perlu (hemat optical-flow CPU)
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False
